<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SEO Analyzer Ultimate</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f4f7f6; font-family: 'Inter', sans-serif; padding-top: 50px; }
        .search-card { background: white; border-radius: 15px; padding: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); margin-bottom: 30px; }
        .audit-section { background: white; border-radius: 12px; padding: 25px; margin-bottom: 20px; border-left: 5px solid #4285f4; }
        .badge-pro { font-size: 0.9rem; padding: 6px 12px; }
        .success-text { color: #28a745; font-weight: bold; }
        .error-text { color: #dc3545; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="search-card text-center">
        <h1 class="mb-4">🚀 SEO Audit Engine</h1>
        <div class="d-flex gap-2 justify-content-center">
            <input type="text" id="targetUrl" class="form-control w-50" placeholder="https://example.com">
            <button class="btn btn-primary px-4" id="runBtn" onclick="runAnalysis()">Analyze Now</button>
        </div>
        <div id="loader" class="mt-4" style="display:none;">
            <div class="spinner-grow text-primary" role="status"></div>
            <p>Crawling website assets...</p>
        </div>
    </div>

    <div id="results" style="display:none;">
        <div class="row">
            <div class="col-md-6">
                <div class="audit-section">
                    <h5>Content & Tags</h5>
                    <hr>
                    <p><b>Title:</b> <span id="rTitle"></span></p>
                    <p><b>H1 Count:</b> <span id="rH1"></span></p>
                    <p><b>Mobile Viewport:</b> <span id="rView"></span></p>
                    <p><b>Images Missing Alt:</b> <span id="rAlt"></span></p>
                </div>
            </div>

            <div class="col-md-6">
                <div class="audit-section" style="border-left-color: #34a853;">
                    <h5>Technical Performance</h5>
                    <hr>
                    <p><b>Server Response:</b> <span id="rSpeed"></span></p>
                    <p><b>Robots.txt:</b> <span id="rRobots"></span></p>
                    <p><b>Sitemap.xml:</b> <span id="rSitemap"></span></p>
                    <p><b>OG Social Tags:</b> <span id="rSocial"></span></p>
                </div>
            </div>
        </div>

        <div class="audit-section" style="border-left-color: #ea4335;">
            <h5>Broken Links Analysis</h5>
            <ul id="rBrokenList" class="mt-2"></ul>
        </div>
    </div>
</div>

<script>
    async function runAnalysis() {
        const url = document.getElementById('targetUrl').value;
        if(!url) return alert("Please enter a URL");

        document.getElementById('loader').style.display = 'block';
        document.getElementById('results').style.display = 'none';

        try {
            const res = await fetch('/api/audit', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ url })
            });
            const d = await res.json();

            document.getElementById('rTitle').innerText = d.onPage.title;
            document.getElementById('rH1').innerText = d.onPage.h1Count;
            document.getElementById('rView').innerText = d.onPage.viewport ? "✅ Active" : "❌ Missing Viewport";
            document.getElementById('rAlt').innerText = d.images.missingAlt;
            
            document.getElementById('rSpeed').innerText = d.technical.responseTime;
            document.getElementById('rRobots').innerText = d.technical.robotsTxt ? "✅ Found" : "❌ Missing";
            document.getElementById('rSitemap').innerText = d.technical.sitemapXml ? "✅ Found" : "❌ Missing";
            document.getElementById('rSocial').innerText = d.social.ogTitle ? "✅ Found" : "❌ Missing OG Tags";

            const bl = document.getElementById('rBrokenList');
            bl.innerHTML = d.brokenLinks.length > 0 
                ? d.brokenLinks.map(l => `<li class="text-danger">${l}</li>`).join('')
                : '<li class="text-success">Perfect! No broken links found in top pages.</li>';

            document.getElementById('results').style.display = 'block';
        } catch (e) {
            alert("Error analyzing the site.");
        } finally {
            document.getElementById('loader').style.display = 'none';
        }
    }
</script>
</body>
</html>
